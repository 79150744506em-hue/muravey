name: Deploy to Yandex Cloud

# Основной хостинг — Yandex Cloud: каждый пуш в main выкладывает сайт. Можно запустить и вручную.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"

      - name: Deploy
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          MURAVEY_PASSWORD: ${{ secrets.MURAVEY_PASSWORD }}
          # Client ID не секрет: он и так виден на странице входа Google
          GOOGLE_CLIENT_ID: 715842427084-4tb6mu4i080c770mvis1234om4rs2tbq.apps.googleusercontent.com
        run: bash deploy/deploy.sh
